name: lucky-care-plus

# The API/worker/scheduler image is built once and reused by all three
# services. The build context is backend/; backend/Dockerfile.dockerignore keeps
# .env, vendor/ and developer state out of the image.
x-app-build: &app-build
  context: ./backend
  dockerfile: Dockerfile

# Inside the compose network the services talk to each other on the standard
# ports. The host ports 5433/6380 (AGENTS.md section 6) are for a developer's
# host process and must not be used from a container.
x-app-environment: &app-environment
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Malware scanning (ADR-014) is ON by default since 2026-10-25 (owner decision):
  # a document is only persisted after a clean verdict. clamd is reached over the
  # private compose network (`tcp://clamav:3310`), which is simpler than sharing a
  # unix socket - the clamav image appends LocalSocket entries instead of replacing
  # them, so a socket override silently keeps listening on /tmp/clamd.sock.
  #
  # Consequence, by design: running the `app` profile WITHOUT the `scan` profile
  # makes document uploads fail closed (503 scan_unavailable). Start both:
  #   docker compose --profile app --profile scan up -d
  # Set DOCUMENTS_SCAN_REQUIRED=false only for a deployment that stores no
  # documents at all.
  DOCUMENTS_SCANNER: clamav
  DOCUMENTS_CLAMAV_SOCKET: tcp://clamav:3310
  DOCUMENTS_SCAN_REQUIRED: ${DOCUMENTS_SCAN_REQUIRED:-true}

# Bounded log retention for every container. `docker compose logs` is the only
# log store in the reference stack, so a laptop or a small host must not let a
# noisy process fill the disk. See backend/docs/DEPLOYMENT.md section 15.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: luckycare-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: lucky_care_plus
      POSTGRES_USER: luckycare
      POSTGRES_PASSWORD: luckycare_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luckycare -d lucky_care_plus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: luckycare-redis
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO is optional for Phase 0 (documents/object storage arrive in Phase 1).
  # Docker Hub blocked `minio/minio`; use the quay.io registry when you need it:
  #   docker compose --profile storage up -d
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    container_name: luckycare-minio
    logging: *default-logging
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: luckycare
      MINIO_ROOT_PASSWORD: luckycare_dev_secret
    ports:
      - "9002:9000"
      - "9003:9003"
    volumes:
      - miniodata:/data

  # Malware scanning is opt-in. The default `docker compose up -d` does not
  # pull ClamAV; start it with:
  #   docker compose --profile scan up -d clamav
  # First boot downloads the signature database (several minutes). The image
  # serves clamd on TCP 3310 and exposes its unix socket at /tmp/clamd.sock
  # inside the container; the backend adapter uses the unix socket. See
  # backend/docs/MALWARE-SCANNING.md for sharing it with the backend.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:stable
    container_name: luckycare-clamav
    logging: *default-logging
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # -------------------------------------------------------------------------
  # Application profile: docker compose --profile app up -d --build
  #
  # The default `docker compose up -d` stays infrastructure-only. Application
  # configuration is read from backend/.env (copy
  # backend/.env.production.example and generate APP_KEY first). The values
  # below override only network coordinates, never credentials.
  # -------------------------------------------------------------------------
  app:
    profiles: ["app"]
    image: lucky-care-plus/app:${APP_IMAGE_TAG:-local}
    build: *app-build
    container_name: luckycare-app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *app-environment
      CONTAINER_ROLE: app
    volumes:
      - appstorage:/var/www/html/storage/app
      - applogs:/var/www/html/storage/logs
      - knowledgedata:/var/www/html/database/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: nginx:1.27-alpine
    container_name: luckycare-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # TLS terminator. Additive and profile-gated like `app` and `scan`:
  #   docker compose --profile app --profile proxy up -d --build
  #
  # Local mode (default) uses Caddy's internal CA and host port 8443, plus 8088
  # for the HTTP->HTTPS redirect, so the whole TLS path can be exercised without
  # a domain. (8081 is deliberately avoided: it collides with other local
  # projects often enough to be a nuisance.) Domain mode is selected
  # with APP_DOMAIN plus the snippet/port overrides in the comment below:
  #   APP_DOMAIN=api.example.com
  #   CADDY_TLS_SNIPPET=tls_domain
  #   CADDY_HSTS_SNIPPET=hsts
  #   CADDY_REDIRECT_TARGET=https://api.example.com
  #   CADDY_HTTP_PORT=80
  #   CADDY_HTTPS_PORT=443
  # The `web` service keeps its 8080 plain port for local debugging; the proxy
  # is the only public listener in a real deployment.
  proxy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: luckycare-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CADDY_HTTP_PORT:-8088}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      CADDY_TLS_SNIPPET: ${CADDY_TLS_SNIPPET:-tls_local}
      CADDY_HSTS_SNIPPET: ${CADDY_HSTS_SNIPPET:-no_hsts}
      CADDY_REDIRECT_TARGET: ${CADDY_REDIRECT_TARGET:-https://localhost:8443}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_healthy

  queue:
    profiles: ["app"]
    # Same tag as `app`; the build happens once in the `app` service.
    image: lucky-care-plus/app:${APP_IMAGE_TAG:-local}
    container_name: luckycare-queue
    restart: unless-stopped
    init: true
    logging: *default-logging
    # A graceful stop lets the job that is already running finish (the worker
    # timeout is 120s). Docker kills the worker after this grace period.
    stop_grace_period: 130s
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--timeout=120"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *app-environment
      CONTAINER_ROLE: queue
    volumes:
      - appstorage:/var/www/html/storage/app
      - applogs:/var/www/html/storage/logs
      - knowledgedata:/var/www/html/database/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  scheduler:
    profiles: ["app"]
    # Same tag as `app`; the build happens once in the `app` service.
    image: lucky-care-plus/app:${APP_IMAGE_TAG:-local}
    container_name: luckycare-scheduler
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *app-environment
      CONTAINER_ROLE: scheduler
    volumes:
      - appstorage:/var/www/html/storage/app
      - applogs:/var/www/html/storage/logs
      - knowledgedata:/var/www/html/database/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
  appstorage:
  applogs:
  # Caddy's internal CA and issued certificates. Local mode regenerates the CA
  # if this volume is removed; domain mode re-issues on the next start.
  caddydata:
  caddyconfig:
  # Knowledge corpus + SQLite index. Mutable review decisions live here, so the
  # image only ships a seed (database/knowledge-seed) that is copied once on
  # first boot. `docker compose down -v` destroys every review decision.
  knowledgedata:
