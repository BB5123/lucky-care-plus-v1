name: lucky-care-plus

services:
  postgres:
    image: postgres:16-alpine
    container_name: luckycare-postgres
    environment:
      POSTGRES_DB: lucky_care_plus
      POSTGRES_USER: luckycare
      POSTGRES_PASSWORD: luckycare_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luckycare -d lucky_care_plus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: luckycare-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  # MinIO is optional for Phase 0 (documents/object storage arrive in Phase 1).
  # Docker Hub blocked `minio/minio`; use the quay.io registry when you need it:
  #   docker compose --profile storage up -d
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    container_name: luckycare-minio
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: luckycare
      MINIO_ROOT_PASSWORD: luckycare_dev_secret
    ports:
      - "9002:9000"
      - "9003:9003"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
