# Front door for the Lucky Care Plus API.
#
# The application is a JSON API with no public build artefacts: every request
# is executed by backend/public/index.php. The web container is stock nginx and
# does not carry a copy of the source tree, so it hands every request to php-fpm
# in the `app` service. That is what "serves backend/public" means here - the
# front controller is the only file the public directory exposes.
#
# app service: php-fpm on port 9000 (see backend/Dockerfile).
#
# Edge rate limiting is a second, cheaper layer in front of Laravel's own
# throttle middleware. It is per source IP, so it is weak against distributed
# traffic; see backend/docs/DEPLOYMENT.md section 14 for the numbers and the
# limitation.

# The proxy profile forwards X-Forwarded-For. Use its first address as the
# rate-limit key so a request that arrives through Caddy is limited per client
# instead of per proxy. Direct requests to the debug port have no header and
# fall back to the connection address. Do not expose port 8080 publicly: a
# direct client can spoof this header.
map $http_x_forwarded_for $luckycare_client_ip {
    ~^(?<luckycare_forwarded_ip>[0-9A-Fa-f:.]+) $luckycare_forwarded_ip;
    default $binary_remote_addr;
}

map $http_x_forwarded_proto $luckycare_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $luckycare_forwarded_host {
    default $http_x_forwarded_host;
    "" $host;
}

# Auth endpoints (credential stuffing): ~10 requests/minute per IP.
limit_req_zone $luckycare_client_ip zone=auth_limit:10m rate=10r/m;
# Everything else: ~60 requests/minute per IP.
limit_req_zone $luckycare_client_ip zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # config/documents.php rejects document uploads above 10 MiB and returns a
    # Thai 422 naming the limit. Keep nginx just above it so multipart overhead
    # does not turn that 422 into a 413. Keep this in sync with
    # upload_max_filesize/post_max_size in backend/Dockerfile (12M).
    client_max_body_size 12m;

    # Preserve the TLS terminator's forwarding headers so Laravel can use them
    # once TRUSTED_PROXIES names every hop (see DEPLOYMENT.md section 13).
    # `$proxy_add_x_forwarded_for` appends this nginx hop, which is what the
    # trusted-proxy list must include. Do not rewrite $remote_addr here:
    # Laravel must still see nginx as its direct peer to trust these headers.
    fastcgi_param HTTP_X_FORWARDED_PROTO $luckycare_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_HOST $luckycare_forwarded_host;
    fastcgi_param HTTP_PROXY "";

    # A 429 may come from nginx's limit_req or from Laravel's own throttle;
    # both become the same small JSON body. Laravel still enforces its own
    # per-endpoint budget, so this only normalises the response.
    error_page 429 = @luckycare_rate_limited;

    location @luckycare_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"Too many requests"}';
    }

    # Credential, PIN and OTP guessing endpoints. The trailing slash is
    # deliberate: /api/v1/auth/* is the whole public auth surface.
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO "";

        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    # Everything else, including /up and /ready.
    location / {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO "";

        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }
}
