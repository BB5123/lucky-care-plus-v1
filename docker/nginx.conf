# Minimal front door for the Lucky Care Plus API.
#
# The application is a JSON API with no public build artefacts: every request
# is executed by backend/public/index.php. The web container is stock nginx and
# does not carry a copy of the source tree, so it hands every request to php-fpm
# in the `app` service. That is what "serves backend/public" means here - the
# front controller is the only file the public directory exposes.
#
# app service: php-fpm on port 9000 (see backend/Dockerfile).

server {
    listen 80;
    server_name _;

    # config/documents.php rejects document uploads above 10 MiB and returns a
    # Thai 422 naming the limit. Keep nginx just above it so multipart overhead
    # does not turn that 422 into a 413. Keep this in sync with
    # upload_max_filesize/post_max_size in backend/Dockerfile (12M).
    client_max_body_size 12m;

    # Preserve the TLS terminator's forwarding headers so Laravel can use them
    # once the application's trusted-proxy list is configured. The stack itself
    # terminates nothing (see backend/docs/DEPLOYMENT.md section 10).
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_PROXY "";

    location / {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO "";

        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }
}
